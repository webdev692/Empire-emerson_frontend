# App-local Netlify configuration; deploy-preview evidence must match the PR head.
[build]
  command = "npm run build"
  publish = "dist"

[context.deploy-preview]
  command = "npm run build -- --mode design-preview"

# The standard app-local file is discovered from the existing epdg base.
# Keep production on the reviewed isolated hosted profile with its exact Git SHA.
[context.production]
  command = 'test -n "$COMMIT_REF" && GITHUB_SHA="$COMMIT_REF" npm run build:hosted-practice'
  publish = "dist-hosted-practice"

[context.production.environment]
  EPDG_HOSTED_PRACTICE_ENABLED = "1"

[build.environment]
  NODE_VERSION = "22.23.1"
  NPM_VERSION = "11.17.0"
  VITE_MOCK_AUTH = "false"

# Headers/redirects are global in TOML, so each Vite build emits its own
# reviewed _headers/_redirects. Hosted output must not inherit legacy caching.
