# App-local Netlify configuration; deploy-preview evidence must match the PR head.
[build]
  command = "npm --prefix .. ci --no-audit --no-fund && npm run build:website"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.1"
  NPM_VERSION = "11.17.0"

[context.deploy-preview]
  command = "npm --prefix .. ci --no-audit --no-fund && npm run build:website"

[context.deploy-preview.environment]
  DEPLOY_BASE_PATH = "/"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
