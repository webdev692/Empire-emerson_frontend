name: Frozen public company content
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  company:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Original published artifacts (Windows)
            runner: windows-2025
            platform: windows
            check: check:public
          - name: Verified compiler fingerprints (Linux)
            runner: ubuntu-24.04
            platform: linux
            check: check:public:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm ci
        working-directory: Emerson_Empire
      - run: npm ci
        working-directory: Agency_LandingPage
      - run: npm ci
        working-directory: EPDG-Landing-Page
      - run: npm run ${{ matrix.check }}
      - name: Retain public output for failed artifact comparison
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: company-public-output-${{ matrix.platform }}-${{ github.sha }}
          retention-days: 3
          path: |
            Emerson_Empire/dist/
            Agency_LandingPage/dist/
            EPDG-Landing-Page/dist/
            !**/*.map
            !**/.env*
